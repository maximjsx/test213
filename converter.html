      const latinToCyrillic = {
        a: "а",

        C: "Ц",
        Ch: "Ч",
        Sh: "Ш",
        Sht: "Щ",
        Yu: "Ю",
        Q: "Я",
        W: "В",
      };

      function convertToCyrillic(text, useCriticalWords = true) {
        let parts = text.split(/(\s+|[.,\/#!$%\^&\*;:{}=\-_`~()?\[\]])/);

        parts = parts.map((part) => {
          if (
            /^\s+$/.test(part) ||
            /^[.,\/#!$%\^&\*;:{}=\-_`~()?\[\]]$/.test(part)
          ) {
            return part;
          }

          let converted = part;

          if (
            useCriticalWords &&
            criticalWords.hasOwnProperty(part.toLowerCase())
          ) {
            converted = criticalWords[part.toLowerCase()];
            if (part[0] === part[0].toUpperCase()) {
              converted = converted[0].toUpperCase() + converted.slice(1);
            }
          } else {
            converted = converted.replace(
              /sht|ch|sh|ts|ya|yu|zh|[a-z4-6wy]/gi,
              function (match) {
                if (match.toLowerCase() === "sht")
                  return match === "sht" ? "щ" : "Щ";
                if (match.toLowerCase() === "ch")
                  return match === "ch" ? "ч" : "Ч";
                if (match.toLowerCase() === "sh")
                  return match === "sh" ? "ш" : "Ш";
                if (match.toLowerCase() === "ts")
                  return match === "ts" ? "ц" : "Ц";
                if (match.toLowerCase() === "ya")
                  return match === "ya" ? "я" : "Я";
                if (match.toLowerCase() === "yu")
                  return match === "yu" ? "ю" : "Ю";
                if (match.toLowerCase() === "zh")
                  return match === "zh" ? "ж" : "Ж";
                if (match.toLowerCase() === "y")
                  return match === "y" ? "ъ" : "Ъ";
                return latinToCyrillic[match] || match;
              }
            );
          }

          return converted;
        });

        return parts.join("");
      }

      function testCriticalWords() {
        console.log("Useless words:");
        for (let word in criticalWords) {
          const convertedWord = convertToCyrillic(word, false);
          if (convertedWord === criticalWords[word]) {
            console.log(`${word}`);
          }
        }
      }

      function checkForDuplicates() {
        let seenWords = new Set();
        let duplicates = [];

        for (let word in criticalWords) {
          if (seenWords.has(word)) {
            duplicates.push(word);
          } else {
            seenWords.add(word);
          }
        }

        if (duplicates.length > 0) {
          console.log(`Duplicate words found: ${duplicates.join(", ")}`);
        } else {
          console.log("No duplicate words found.");
        }
      }

      checkForDuplicates();
      testCriticalWords();

      async function pasteText() {
        try {
          const text = await navigator.clipboard.readText();
          const input = document.getElementById("input");
          if (text) {
            input.value = text;
            updateOutput();
          }
        } catch (err) {
          console.error("Failed to read clipboard contents: ", err);
        }
      }

      function pasteExample() {
        const input = document.getElementById("input");
        input.value =

          "Kyde e towa?\n" +
          "okay, dobyr, koyto,\n \n" +
          "I mnogo drugo.";
        updateOutput();
      }

      function updateOutput() {
        const input = document.getElementById("input");
        const output = document.getElementById("output");
        output.value = convertToCyrillic(input.value);
      }

      function copyText(id) {
        const text = document.getElementById(id);
        text.select();
        document.execCommand("copy");
      }

      function clearText(id) {
        document.getElementById(id).value = "";
        if (id === "input") {
          document.getElementById("output").value = "";
        }
      }

      const input = document.getElementById("input");
      const output = document.getElementById("output");

      input.addEventListener("input", function () {
        output.value = convertToCyrillic(this.value);
